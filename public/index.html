<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>剪辑 Agent · 口播视频自动成片</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --cyan: #22d3ee; --ink: #05070c; --card: rgba(255,255,255,.04); --line: rgba(255,255,255,.10); }
  body {
    min-height: 100vh; background:
      radial-gradient(900px 700px at 15% 8%, rgba(34,211,238,.13), transparent 60%),
      radial-gradient(800px 700px at 90% 90%, rgba(142,163,196,.12), transparent 60%), var(--ink);
    color: #eef1f8; font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; justify-content: center; padding: 48px 20px 80px;
  }
  .wrap { width: 100%; max-width: 880px; }
  h1 { font-size: 34px; font-weight: 900; letter-spacing: .01em; }
  h1 span { color: var(--cyan); }
  .sub { margin-top: 10px; color: #93a0b6; font-size: 16px; line-height: 1.6; }
  .panel { margin-top: 28px; border: 1px solid var(--line); border-radius: 20px; background: var(--card); padding: 24px; }
  .modes { display: flex; gap: 10px; margin-bottom: 18px; }
  .mode {
    flex: 1; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.02);
    cursor: pointer; font-size: 15px; font-weight: 700; color: #9aa8c0; text-align: center; transition: all .18s ease;
  }
  .mode.on { border-color: rgba(34,211,238,.55); background: rgba(34,211,238,.10); color: #dff8ff; }
  .drop {
    border: 1.5px dashed rgba(255,255,255,.18); border-radius: 16px; padding: 38px 20px; text-align: center;
    color: #8e9cb4; cursor: pointer; transition: all .18s ease;
  }
  .drop:hover, .drop.over { border-color: rgba(34,211,238,.6); color: #dff8ff; background: rgba(34,211,238,.05); }
  .drop b { display: block; color: #eef1f8; font-size: 17px; margin-bottom: 6px; }
  .drop .file { margin-top: 10px; color: var(--cyan); font-size: 14px; }
  textarea {
    width: 100%; min-height: 130px; resize: vertical; border-radius: 16px; border: 1px solid var(--line);
    background: rgba(255,255,255,.03); color: #eef1f8; padding: 16px; font-size: 16px; line-height: 1.6; font-family: inherit;
  }
  textarea:focus { outline: none; border-color: rgba(34,211,238,.55); }
  .go {
    margin-top: 18px; width: 100%; padding: 16px; border: none; border-radius: 16px; cursor: pointer;
    background: linear-gradient(120deg, #22d3ee, #6ee7f5); color: #04222a; font-size: 17px; font-weight: 900;
    transition: transform .12s ease, filter .18s ease;
  }
  .go:hover { filter: brightness(1.06); }
  .go:active { transform: scale(.99); }
  .go:disabled { opacity: .45; cursor: not-allowed; }
  .hint { margin-top: 12px; font-size: 13px; color: #7c8aa2; line-height: 1.6; }
  .prog { margin-top: 28px; display: none; }
  .bar { height: 10px; border-radius: 999px; background: rgba(255,255,255,.09); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg,#22d3ee,#8fa6c4); transition: width .3s ease; }
  .stages { display: flex; justify-content: space-between; margin-top: 12px; font-size: 13px; color: #7c8aa2; }
  .stages b { color: var(--cyan); font-weight: 700; }
  .log {
    margin-top: 16px; height: 190px; overflow: auto; border-radius: 14px; border: 1px solid var(--line);
    background: rgba(0,0,0,.28); padding: 14px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px;
    line-height: 1.7; color: #9fb0c8; white-space: pre-wrap;
  }
  .result { margin-top: 28px; display: none; }
  video { width: 100%; border-radius: 18px; background: #000; display: block; }
  .row { display: flex; gap: 12px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  a.dl {
    padding: 12px 22px; border-radius: 12px; background: rgba(34,211,238,.14); border: 1px solid rgba(34,211,238,.45);
    color: #a5f3fc; text-decoration: none; font-weight: 700; font-size: 15px;
  }
  .meta { color: #7c8aa2; font-size: 13px; }
  .err { margin-top: 16px; color: #fca5a5; font-size: 14px; display: none; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>剪辑 Agent · <span>口播视频自动成片</span></h1>
  <p class="sub">放一段口播视频或写一句主题，Agent 会自动转写、分镜、配图解动效、加字幕和音效，输出竖屏短视频。<br/>全程无需操作，等待即可。</p>

  <div class="panel">
    <div class="modes">
      <div class="mode on" data-mode="video">① 上传口播视频</div>
      <div class="mode" data-mode="prompt">② 输入提示词</div>
    </div>

    <div id="videoBox">
      <div class="drop" id="drop">
        <b>把视频拖到这里，或点击选择</b>
        支持 mp4 / mov / mkv，建议竖屏口播
        <div class="file" id="fileName"></div>
      </div>
      <input type="file" id="file" accept="video/*" hidden />
    </div>

    <div id="promptBox" style="display:none">
      <textarea id="prompt" placeholder="例如：用 30 秒讲清楚什么是神经网络，面向完全不懂技术的普通人"></textarea>
    </div>

    <button class="go" id="go">开始生成</button>
    <div class="hint">成片为 1080×1920 竖屏。渲染约 5~15 分钟（取决于视频长度），期间可以离开页面，完成后回来即可。</div>
    <div class="err" id="err"></div>
  </div>

  <div class="prog" id="prog">
    <div class="bar"><i id="bar"></i></div>
    <div class="stages"><span id="stage">排队中</span><span id="pct">0%</span></div>
    <div class="log" id="log"></div>
  </div>

  <div class="result" id="result">
    <video id="player" controls playsinline></video>
    <div class="row">
      <a class="dl" id="dl" download="clip.mp4">下载成片</a>
      <span class="meta" id="meta"></span>
    </div>
  </div>
</div>

<script>
let mode = "video";
let file = null;
let uploadId = null;

document.querySelectorAll(".mode").forEach((el) => {
  el.onclick = () => {
    mode = el.dataset.mode;
    document.querySelectorAll(".mode").forEach((x) => x.classList.toggle("on", x === el));
    document.getElementById("videoBox").style.display = mode === "video" ? "" : "none";
    document.getElementById("promptBox").style.display = mode === "prompt" ? "" : "none";
  };
});

const drop = document.getElementById("drop");
drop.onclick = () => document.getElementById("file").click();
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); pick(e.dataTransfer.files[0]); };
document.getElementById("file").onchange = (e) => pick(e.target.files[0]);

function pick(f) {
  if (!f) return;
  file = f;
  document.getElementById("fileName").textContent = f.name + " · " + (f.size / 1024 / 1024).toFixed(1) + " MB";
}

const $ = (id) => document.getElementById(id);
$("go").onclick = async () => {
  $("err").style.display = "none";
  if (mode === "video" && !file) { $("err").textContent = "请先选择一段视频"; $("err").style.display = "block"; return; }
  if (mode === "prompt" && !$("prompt").value.trim()) { $("err").textContent = "请输入提示词"; $("err").style.display = "block"; return; }
  $("go").disabled = true;
  $("prog").style.display = "block";
  $("result").style.display = "none";
  $("log").textContent = "";

  try {
    let body;
    if (mode === "video") {
      $("log").textContent = "上传中…\n";
      const up = await fetch("/api/upload", { method: "PUT", body: file });
      const uj = await up.json();
      if (!uj.uploadId) throw new Error(uj.error || "上传失败");
      uploadId = uj.uploadId;
      body = { mode: "video", uploadId, name: file.name || "input.mp4" };
    } else {
      body = { mode: "prompt", prompt: $("prompt").value.trim() };
    }
    const res = await fetch("/api/jobs", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const j = await res.json();
    if (!j.id) throw new Error(j.error || "创建任务失败");
    watch(j.id);
  } catch (e) {
    $("err").textContent = String(e.message || e);
    $("err").style.display = "block";
    $("go").disabled = false;
  }
};

function finish(id, j) {
  localStorage.removeItem("jobId");
  $("go").disabled = false;
  $("prog").style.display = "block";
  $("result").style.display = "block";
  $("player").src = `/api/jobs/${id}/video`;
  $("dl").href = `/api/jobs/${id}/video`;
  $("meta").textContent = "成片已生成" + (j.duration ? " · 时长约 " + Math.round(j.duration) + " 秒" : "");
  $("result").scrollIntoView({ behavior: "smooth" });
}

function watch(id) {
  localStorage.setItem("jobId", id);
  const es = new EventSource(`/api/jobs/${id}/stream`);
  let logCount = 0;
  es.onmessage = (ev) => {
    const j = JSON.parse(ev.data);
    $("bar").style.width = j.progress + "%";
    $("pct").textContent = j.progress + "%";
    $("stage").innerHTML = "<b>" + j.stage + "</b>";
    if (j.log.length !== logCount) {
      logCount = j.log.length;
      const el = $("log");
      el.textContent = j.log.join("\n");
      el.scrollTop = el.scrollHeight;
    }
    if (j.status === "done") {
      es.close();
      finish(id, j);
    }
    if (j.status === "error") {
      es.close();
      localStorage.removeItem("jobId");
      $("go").disabled = false;
      $("err").textContent = "生成失败：" + (j.error || "未知错误");
      $("err").style.display = "block";
    }
  };
  es.onerror = () => { es.close(); $("go").disabled = false; };
}

// 刷新页面后自动接回未完成的任务（渲染要几分钟，允许离开页面）
window.addEventListener("DOMContentLoaded", async () => {
  const id = localStorage.getItem("jobId");
  if (!id) return;
  try {
    const r = await fetch(`/api/jobs/${id}/json`);
    if (!r.ok) throw new Error("gone");
    const j = await r.json();
    if (j.status === "done") return finish(id, j);
    if (j.status === "error") { localStorage.removeItem("jobId"); return; }
    $("prog").style.display = "block";
    $("go").disabled = true;
    watch(id);
  } catch {
    localStorage.removeItem("jobId");
  }
});
</script>
</body>
</html>
